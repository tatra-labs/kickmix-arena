[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kickmix-arena"
version = "0.1.0"
description = "An open arena where LLM agents discover cheaper reversible quantum circuits, verified exactly and scored by Toffolis x qubits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tatra Labs" }]
keywords = ["quantum", "quantum-circuits", "reversible-computing", "llm", "ai-for-science", "toffoli", "benchmark"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kickmix = "kickmix.cli:main"

[project.urls]
Homepage = "https://github.com/tatra-labs/kickmix-arena"
Paper = "https://arxiv.org/abs/2610.22367"

[tool.hatch.build.targets.wheel]
packages = ["kickmix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
